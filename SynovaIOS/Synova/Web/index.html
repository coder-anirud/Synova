<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="Synova — a friendly brain-computer interface for restoring movement."
    />
    <title>Synova — Where Thought Becomes Motion.</title>
    <link rel="stylesheet" href="./app.css" />
    <style>
      html { -webkit-text-size-adjust: 100%; }
      body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
      .ios-shell .desktop-toolbar { display: none; }
      .ios-shell .mobile-header { display: flex; }
      .ios-shell .sidebar {
        inset: 0 auto 0 0;
        transform: translateX(-102%);
        transition: transform .2s ease;
        box-shadow: 10px 0 30px rgba(0,0,0,.12);
      }
      .ios-shell .sidebar.is-open { transform: none; }
      .ios-shell .sidebar__close { position: absolute; top: 11px; right: 11px; display: grid; }
      .ios-shell .sidebar__nav { margin-top: 48px; }
      .ios-shell .scrim { position: fixed; inset: 0; z-index: 35; display: block; background: rgba(20,27,35,.34); border: 0; }
      .ios-shell .app-main { margin-left: 0; padding-top: 0; }
      @media (pointer: coarse) {
        button, select, input { min-height: 44px; }
      }
    </style>
    <script src="./app.js" defer></script>
  </head>
  <body class="ios-shell">
    <div id="root"></div>
  </body>
</html>
